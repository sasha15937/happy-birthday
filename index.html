<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>С днём рождения!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1a0b2e; --bg2:#3a1457; --pink:#ff7eb6; --gold:#ffd27a; --text:#fff4f8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Playfair Display',Georgia,serif;
    color:var(--text);
    background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg1) 70%);
    overflow:hidden;
  }
  .stars{position:fixed;inset:0;pointer-events:none}
  .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s infinite ease-in-out}
  @keyframes tw{50%{opacity:.1;transform:scale(.6)}}

  canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1}

  .screen{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    transition:opacity 1.2s ease, transform 1.2s ease, visibility 1.2s;
  }
  .screen.hidden{opacity:0;visibility:hidden;transform:scale(1.05);pointer-events:none}

  /* ---------- Экран 1 ---------- */
  #start h1{
    font-family:'Caveat',cursive;font-weight:700;
    font-size:clamp(2.6rem,9vw,5.5rem);line-height:1.1;
    background:linear-gradient(90deg,var(--gold),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:18px;
  }
  #start p{font-size:clamp(1.05rem,3.4vw,1.5rem);max-width:30ch;line-height:1.5;opacity:.92;margin-bottom:44px}
  .gift-btn{
    font:inherit;font-weight:700;font-size:1.3rem;letter-spacing:.04em;
    color:#3a1457;background:linear-gradient(135deg,var(--gold),var(--pink));
    border:none;border-radius:999px;padding:16px 42px;cursor:pointer;
    box-shadow:0 0 0 0 rgba(255,126,182,.6),0 10px 30px rgba(255,126,182,.35);
    animation:pulse 2s infinite;transition:transform .2s;
  }
  .gift-btn:hover{transform:scale(1.07)}
  .gift-btn:active{transform:scale(.97)}
  @keyframes pulse{70%{box-shadow:0 0 0 22px rgba(255,126,182,0),0 10px 30px rgba(255,126,182,.35)}100%{box-shadow:0 0 0 0 rgba(255,126,182,0),0 10px 30px rgba(255,126,182,.35)}}
  .gift-btn .em{display:inline-block;animation:wob 1.6s infinite}
  @keyframes wob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}

  /* ---------- Экран 2 ---------- */
  #gift{justify-content:flex-start;overflow-y:auto;padding-top:5vh}
  #gift h2{
    font-family:'Caveat',cursive;font-size:clamp(2.2rem,7vw,4rem);
    background:linear-gradient(90deg,var(--gold),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:6px;
  }
  #typed{min-height:3.2em;font-size:clamp(1rem,3vw,1.25rem);max-width:38ch;line-height:1.6;margin-bottom:22px;opacity:.95}
  #typed::after{content:'|';animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  .frame{
    position:relative;width:min(88vw,460px);aspect-ratio:4/5;
    border-radius:18px;overflow:hidden;
    border:6px solid #fff;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(255,126,182,.35);
    background:#2a1040;transform:rotate(-1.2deg);flex-shrink:0;
  }
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  .slide.on{opacity:1}
  .slide img{width:100%;height:100%;object-fit:cover;display:block}
  .slide .ph{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Caveat',cursive;font-size:2rem;color:var(--gold);
    background:linear-gradient(135deg,#4b1d73,#8c2f6e);
  }
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(0,0,0,.35);color:#fff;font-size:1.3rem;backdrop-filter:blur(4px);
  }
  .nav.prev{left:8px}.nav.next{right:8px}
  .dots{display:flex;gap:9px;margin:16px 0 8px}
  .dots b{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.35;cursor:pointer;transition:.3s}
  .dots b.on{opacity:1;background:var(--pink);transform:scale(1.35)}

  .hint{font-size:.9rem;opacity:.7;margin:4px 0 28px}
  .more{
    font:inherit;font-size:1.05rem;color:var(--text);background:transparent;
    border:2px solid var(--pink);border-radius:999px;padding:11px 28px;cursor:pointer;margin-bottom:40px;transition:.2s;
  }
  .more:hover{background:var(--pink);color:#3a1457}

  /* ---------- Кнопка назад ---------- */
  .back{
    position:fixed;top:14px;left:14px;z-index:10;
    font:inherit;font-size:1rem;color:var(--text);
    background:rgba(255,255,255,.14);border:none;border-radius:999px;
    padding:10px 18px;cursor:pointer;backdrop-filter:blur(6px);transition:.2s;
  }
  .back:hover{background:rgba(255,255,255,.28)}

  /* ---------- Тортик ---------- */
  #cakeScreen h2{
    font-family:'Caveat',cursive;font-size:clamp(2.2rem,7vw,4rem);
    background:linear-gradient(90deg,var(--gold),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:6px;
  }
  #cakeScreen p{font-size:clamp(1rem,3vw,1.25rem);max-width:30ch;line-height:1.5;opacity:.9;margin-bottom:10px}
  .cake{position:relative;width:240px;height:250px;margin:50px auto 36px}
  .plate{position:absolute;bottom:0;left:-30px;right:-30px;height:16px;border-radius:50%;background:linear-gradient(#f3e4ff,#cdb4e6);box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 8px 8px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
  .layer::before{content:'';position:absolute;top:0;left:0;right:0;height:16px;background:#fff;border-radius:14px 14px 22px 22px;opacity:.92}
  .l1{bottom:12px;width:240px;height:76px;background:linear-gradient(#ff9ec8,#f06aa4)}
  .l2{bottom:84px;width:180px;height:64px;background:linear-gradient(#ffe3a3,#f5c35c)}
  .l3{bottom:144px;width:120px;height:52px;background:linear-gradient(#ff9ec8,#f06aa4)}
  .candles{position:absolute;bottom:194px;left:50%;transform:translateX(-50%);display:flex;gap:24px}
  .candle{position:relative;width:9px;height:36px;border-radius:2px;background:repeating-linear-gradient(45deg,#fff,#fff 5px,#7ec8ff 5px,#7ec8ff 10px)}
  .flame{
    position:absolute;left:50%;bottom:100%;margin-bottom:2px;width:13px;height:22px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 70%,#fff6c4,#ffb62e 60%,#ff6a00);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    box-shadow:0 0 18px 6px rgba(255,190,60,.6);
    animation:flick .15s infinite alternate;transition:opacity .35s;
  }
  .candle:nth-child(2) .flame{animation-delay:.07s}
  .candle:nth-child(3) .flame{animation-delay:.11s}
  @keyframes flick{from{transform:translateX(-50%) scale(1,1) rotate(-3deg)}to{transform:translateX(-50%) scale(.92,1.08) rotate(3deg)}}
  .candle::after{content:'';position:absolute;left:50%;bottom:100%;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);opacity:0}
  .cake.out .flame{opacity:0;animation:none}
  .cake.out .candle::after{animation:smoke 1.8s ease-out}
  @keyframes smoke{0%{opacity:.7;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-60px) scale(3.5)}}

  .mute{
    position:fixed;top:14px;right:14px;z-index:10;width:44px;height:44px;border-radius:50%;
    border:none;background:rgba(255,255,255,.14);color:#fff;font-size:1.2rem;cursor:pointer;
    backdrop-filter:blur(6px);display:none;
  }

  .floaty{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:rise linear forwards}
  @keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<canvas id="fx"></canvas>
<button class="mute" id="mute" title="Звук">🔊</button>

<!-- Экран 1 -->
<section class="screen" id="start">
  <h1>С днём рождения, мамочка!</h1>
  <p>Я приготовил для тебя маленький сюрприз. Нажми на кнопку, чтобы открыть подарок.</p>
  <button class="gift-btn" id="giftBtn"><span class="em">🎁</span> Подарок</button>
</section>

<!-- Экран 2 -->
<section class="screen hidden" id="gift">
  <button class="back" id="backGift">← Назад</button>
  <h2>Это тебе ❤</h2>
  <div id="typed"></div>

  <div class="frame" id="frame">
    <button class="nav prev" id="prev">‹</button>
    <button class="nav next" id="next">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="hint">Нажимай в любом месте — будет салют ✨</div>
  <button class="more" id="more">Тортик 🎂</button>
</section>

<!-- Экран 3: тортик -->
<section class="screen hidden" id="cakeScreen">
  <button class="back" id="backCake">← Назад</button>
  <h2 id="cakeTitle">Загадай желание…</h2>
  <p id="cakeText">А потом задуй свечи 🕯️</p>
  <div class="cake" id="cake">
    <div class="candles">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <div class="layer l3"></div>
    <div class="layer l2"></div>
    <div class="layer l1"></div>
    <div class="plate"></div>
  </div>
  <button class="gift-btn" id="blowBtn">Задуть свечи 💨</button>
</section>

<audio id="song" src="music/song.mp3" loop preload="auto"></audio>

<script>
/* ================= НАСТРОЙКИ — меняй здесь ================= */
const PHOTOS = ['photos/1.jpg','photos/2.jpg','photos/3.jpg','photos/4.jpg','photos/5.jpg'];
const WISH = 'Мамочка, спасибо тебе за тепло, заботу и любовь. Желаю тебе здоровья, радости и самых счастливых дней. Ты у меня самая лучшая!';
const SLIDE_MS = 4500;      // сколько секунд показывать одно фото
/* ============================================================ */

// звёзды
const stars = document.getElementById('stars');
for(let i=0;i<70;i++){
  const s=document.createElement('i');
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
  s.style.animationDelay=Math.random()*3+'s';
  s.style.width=s.style.height=(Math.random()*2+1.5)+'px';
  stars.appendChild(s);
}

// ---------- Салют ----------
const cv=document.getElementById('fx'),ctx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const rockets=[],parts=[];
const COLORS=[0,20,45,330,300,190,280];
function launch(x,targetY){
  rockets.push({x:x??Math.random()*W,y:H,ty:targetY??H*(0.15+Math.random()*0.35),vy:-(8+Math.random()*3),h:COLORS[Math.random()*COLORS.length|0]});
}
function boom(x,y,h){
  const n=70+Math.random()*40|0;
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n,sp=1.5+Math.random()*4.2;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,h:h+Math.random()*30-15});
  }
}
function loop(){
  ctx.globalCompositeOperation='destination-out';
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.y+=r.vy;r.vy*=.985;
    ctx.fillStyle=`hsl(${r.h},100%,70%)`;ctx.fillRect(r.x,r.y,3,8);
    if(r.y<=r.ty||r.vy>-1.2){boom(r.x,r.y,r.h);rockets.splice(i,1)}
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.life-=.012;
    if(p.life<=0){parts.splice(i,1);continue}
    ctx.fillStyle=`hsla(${p.h},100%,65%,${p.life})`;
    ctx.beginPath();ctx.arc(p.x,p.y,2.2*p.life+.4,0,7);ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();
function salvo(n=5){for(let i=0;i<n;i++)setTimeout(()=>launch(),i*260)}

// ---------- Летящие сердечки ----------
function floaty(){
  const e=document.createElement('div');
  e.className='floaty';e.textContent=['❤','💖','🌸','✨','🎈'][Math.random()*5|0];
  e.style.left=Math.random()*100+'vw';e.style.fontSize=(16+Math.random()*22)+'px';
  e.style.animationDuration=(7+Math.random()*6)+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),14000);
}

// ---------- Слайдшоу ----------
const frame=document.getElementById('frame'),dotsEl=document.getElementById('dots');
const slides=[],dots=[];let cur=0,timer;
PHOTOS.forEach((src,i)=>{
  const d=document.createElement('div');d.className='slide';
  const img=new Image();img.src=src;img.alt='Фото '+(i+1);
  img.onerror=()=>{d.innerHTML='<div class="ph">Фото '+(i+1)+'</div>'};
  d.appendChild(img);frame.insertBefore(d,frame.firstChild);slides.push(d);
  const b=document.createElement('b');b.onclick=()=>{show(i);restart()};dotsEl.appendChild(b);dots.push(b);
});
function show(i){
  cur=(i+slides.length)%slides.length;
  slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  dots.forEach((s,k)=>s.classList.toggle('on',k===cur));
}
function restart(){clearInterval(timer);timer=setInterval(()=>show(cur+1),SLIDE_MS)}
document.getElementById('prev').onclick=e=>{e.stopPropagation();show(cur-1);restart()};
document.getElementById('next').onclick=e=>{e.stopPropagation();show(cur+1);restart()};
show(0);

// ---------- Печатающийся текст ----------
function typeText(){
  const el=document.getElementById('typed');el.textContent='';let i=0;
  const t=setInterval(()=>{el.textContent+=WISH[i++];if(i>=WISH.length)clearInterval(t)},45);
}

// ---------- Кнопка "Подарок" ----------
const song=document.getElementById('song'),muteBtn=document.getElementById('mute');
document.getElementById('giftBtn').onclick=()=>{
  song.volume=.8;song.play().catch(()=>{});
  muteBtn.style.display='block';
  document.getElementById('start').classList.add('hidden');
  document.getElementById('gift').classList.remove('hidden');
  salvo(7);setTimeout(typeText,900);restart();
  if(!window.__started){window.__started=true;setInterval(floaty,900);setInterval(()=>salvo(3),7000)}
};
muteBtn.onclick=()=>{song.muted=!song.muted;muteBtn.textContent=song.muted?'🔇':'🔊'};
// ---------- Навигация между экранами ----------
const $=id=>document.getElementById(id);
const scrStart=$('start'),scrGift=$('gift'),scrCake=$('cakeScreen');
function go(hide,show){hide.classList.add('hidden');show.classList.remove('hidden')}
$('backGift').onclick=e=>{e.stopPropagation();go(scrGift,scrStart)};
$('backCake').onclick=e=>{e.stopPropagation();go(scrCake,scrGift)};

// ---------- Тортик ----------
const cake=$('cake');let blown=false;
function relight(){
  blown=false;cake.classList.remove('out');
  $('cakeTitle').textContent='Загадай желание…';
  $('cakeText').textContent='А потом задуй свечи 🕯️';
  $('blowBtn').textContent='Задуть свечи 💨';
}
$('more').onclick=e=>{e.stopPropagation();relight();go(scrGift,scrCake)};
$('blowBtn').onclick=()=>{
  if(!blown){
    blown=true;cake.classList.add('out');
    $('cakeTitle').textContent='Ура! С днём рождения! 🎉';
    $('cakeText').textContent='Пусть желание сбудется!';
    $('blowBtn').textContent='Зажечь снова 🕯️';
    salvo(10);setTimeout(()=>salvo(6),2500);
  }else{relight()}
};
document.getElementById('gift').addEventListener('click',e=>{
  if(e.target.closest('button'))return;
  launch(e.clientX,e.clientY);
});
</script>
</body>
</html>
